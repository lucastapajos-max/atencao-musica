name: Coleta semanal

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 06h de Brasília: fecha a semana que terminou no domingo
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python coleta.py
      # Só grava o banco se os testes passarem com os dados novos.
      - run: python -m pytest tests -q
      - name: Grava o banco atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atencao.db
          git diff --cached --quiet && echo "Sem dados novos." && exit 0
          git commit -m "Coleta semanal: dados até $(date -d 'last sunday' +%d/%m/%Y)"
          git push
